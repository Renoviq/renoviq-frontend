name: Deploy frontend

# Manual only, to save GitHub Actions minutes: Actions tab -> Deploy frontend -> Run workflow.
# The first run creates /var/www/renoviq on the server. Every run copies the new build into its own
# folder next to the old ones (the 2 previous builds are kept as backup) and then switches the
# "current" link that nginx serves. nginx is configured by hand on the server, never by this workflow.
on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

      - run: npm run build

      # Third-party actions get the SSH key, so they are pinned to a commit instead of a moving tag.
      - name: Create /var/www/renoviq on the server (first run)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            if [ ! -w /var/www/renoviq/releases ]; then
              sudo -n install -d -o "$(id -un)" -g "$(id -gn)" /var/www/renoviq /var/www/renoviq/releases || {
                echo "Cannot create /var/www/renoviq: give this user passwordless sudo, or run once: sudo install -d -o $(id -un) /var/www/renoviq /var/www/renoviq/releases"
                exit 1
              }
            fi

      # Each build goes into its own folder, so the old builds are never touched.
      - name: Copy the new build to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: dist/*
          target: /var/www/renoviq/releases/${{ github.sha }}
          strip_components: 1
          rm: true

      # The link is swapped in one step, so visitors never see a half-copied site.
      # touch: the clean-up sorts releases by time and the copied folder keeps the build's old time.
      # The release just activated is never deleted; it plus the 2 newest others are kept as backup.
      - name: Switch nginx to the new build and clean up old backups
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SHA
          script: |
            set -eu
            WEB=/var/www/renoviq
            test -s "$WEB/releases/$SHA/index.html"
            touch "$WEB/releases/$SHA"
            ln -sfn "$WEB/releases/$SHA" "$WEB/current.new"
            mv -Tf "$WEB/current.new" "$WEB/current"
            cd "$WEB/releases"
            ls -1t | grep -vxF "$SHA" | tail -n +3 | xargs -r rm -rf --
